name: CI + Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: npm test

      - name: Validate deployment layout
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash -n scripts/update-devspace.sh
          grep -Fq 'APP="${APP:-/opt/devspace}"' scripts/update-devspace.sh
          grep -Fq 'STATE_DIR="${STATE_DIR:-/var/lib/devspace}"' scripts/update-devspace.sh
          grep -Fq 'CONFIG_DIR="${CONFIG_DIR:-/etc/devspace}"' scripts/update-devspace.sh
          grep -Fq 'CLI_BIN="${CLI_BIN:-/usr/local/bin/devspace}"' scripts/update-devspace.sh
          grep -Fq 'test -f "$UNPACK/dist/local-agent-daemon-main.js"' scripts/update-devspace.sh
          grep -Fq 'exec /usr/bin/node "$APP/dist/cli.js" "\$@"' scripts/update-devspace.sh
          if grep -Fq '/root/codex' scripts/update-devspace.sh; then
            echo 'Deployment script must not depend on /root/codex.' >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])git([[:space:]]|$)' scripts/update-devspace.sh; then
            echo 'Deployment script must not invoke git.' >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

  package-linux:
    name: Package Linux deployment
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Keep production dependencies
        run: npm prune --omit=dev

      - name: Verify native runtime dependencies
        run: |
          node --input-type=module -e "const pty = await import('node-pty'); if (typeof pty.spawn !== 'function') process.exit(1)"
          node --input-type=module -e "const { default: Database } = await import('better-sqlite3'); const db = new Database(':memory:'); db.close()"

      - name: Package deployment bundle
        run: |
          tar -czf devspace-linux-x64.tar.gz dist node_modules package.json package-lock.json README.md docs skills
          sha256sum devspace-linux-x64.tar.gz > devspace-linux-x64.tar.gz.sha256

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: devspace-linux-x64
          path: |
            devspace-linux-x64.tar.gz
            devspace-linux-x64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: devspace-linux-x64
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "DevSpace $GITHUB_REF_NAME" \
              --generate-notes
          fi
